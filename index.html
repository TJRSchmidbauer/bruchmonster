/* ==========================================================================
   Bruchmonster – Sticker-Comic (siehe docs/design-direction.md)
   1 Tokens · 2 Basis · 3 Bauteile · 4 Bruchbauteil · 5 Bildschirme · 6 Bewegung
   ========================================================================== */

/* 1 Tokens ---------------------------------------------------------------- */
:root {
  --ink: #2B1B3D;
  --bg: #EDE4FF;
  --paper: #FFFFFF;
  --pumpkin: #FF8A1F;
  --lemon: #FFD43B;
  --algae: #22A866;
  --bramble: #D93D73;
  --w-strahl: #14A9BD;
  --w-streifen: #FF8A1F;
  --w-alltag: #7DB82F;
  --w-detektiv: #7B5CFF;

  --font-display: 'Grandstander', system-ui, sans-serif;
  --font-text: 'Atkinson Hyperlegible', system-ui, sans-serif;

  --fs-s: 0.875rem;
  --fs-m: 1rem;
  --fs-l: 1.25rem;
  --fs-xl: 1.5rem;
  --fs-2xl: 2rem;
  --fs-3xl: 3rem;

  --sp-1: 0.25rem;
  --sp-2: 0.5rem;
  --sp-3: 0.75rem;
  --sp-4: 1rem;
  --sp-5: 1.5rem;
  --sp-6: 2rem;
  --sp-7: 3rem;

  --r-page: 28px;
  --r-card: 20px;
  --r-pill: 999px;
  --r-field: 14px;

  --line: 3px;
  --shadow: 4px 4px 0 var(--ink);
  --shadow-pressed: 2px 2px 0 var(--ink);
}

/* Hell-Modus ist der einzige Modus: Farbschema ausdruecklich festlegen. */
:root { color-scheme: light; }

/* 2 Basis ----------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-text);
  font-size: var(--fs-m);
  line-height: 1.5;
}

h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 900;
  line-height: 1.1;
  margin: 0;
}

p { margin: 0; }
ul, ol { list-style: none; margin: 0; padding: 0; }

:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 0;
  box-shadow: 0 0 0 6px var(--lemon);
}
h1:focus { outline: none; box-shadow: none; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

[hidden] { display: none !important; }

/* 3 Bauteile -------------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  min-height: 52px;
  padding: 0 var(--sp-5);
  border: var(--line) solid var(--ink);
  border-radius: var(--r-pill);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: var(--fs-m);
  line-height: 1.1;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 80ms ease-out, box-shadow 80ms ease-out;
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: translate(2px, 2px); box-shadow: var(--shadow-pressed); }
.btn--primary { background: var(--pumpkin); font-weight: 900; font-size: var(--fs-l); }
.btn--secondary { background: var(--paper); }
.btn--danger { background: #B02A5B; color: var(--paper); }
.btn--ghost { background: transparent; box-shadow: none; border-color: transparent; text-decoration: underline; text-underline-offset: 3px; }
.btn--ghost:active { transform: none; background: rgba(43, 27, 61, 0.08); }
.btn--ghost:hover { background: rgba(43, 27, 61, 0.06); }

.card {
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: var(--r-card);
  box-shadow: var(--shadow);
  padding: var(--sp-5);
}
.card__title { font-size: var(--fs-xl); margin-bottom: var(--sp-3); }

.field__label { display: block; font-weight: 700; margin-bottom: var(--sp-2); }
.field {
  display: block;
  width: 100%;
  min-height: 52px;
  padding: 0 var(--sp-4);
  border: var(--line) solid var(--ink);
  border-radius: var(--r-field);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-text);
  font-size: var(--fs-l);
  margin-bottom: var(--sp-4);
}
.field--hint { margin-bottom: var(--sp-2); }
.field__hint { margin-bottom: var(--sp-4); }
.field::placeholder { color: #6B5B7B; }

.notice {
  background: var(--lemon);
  border: var(--line) solid var(--ink);
  border-radius: var(--r-card);
  padding: var(--sp-3) var(--sp-4);
  font-weight: 700;
}
.notice--error { background: var(--paper); border-color: var(--bramble); box-shadow: 4px 4px 0 var(--bramble); }

.small { font-size: var(--fs-s); margin-bottom: var(--sp-3); }
.dot { width: 22px; height: 22px; border-radius: 50%; border: var(--line) solid var(--ink); flex: none; }

.coin-icon {
  display: inline-block;
  width: 1.25em; height: 1.25em;
  border-radius: 50%;
  background: var(--lemon);
  border: 2.5px solid var(--ink);
  position: relative;
  flex: none;
}
.coin-icon::after {
  content: '';
  position: absolute; inset: 22%;
  border: 2px solid var(--ink);
  border-radius: 50%;
}
.coins {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  font-family: var(--font-display); font-weight: 900; font-size: var(--fs-l);
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: var(--r-pill);
  padding: var(--sp-1) var(--sp-3);
  min-height: 44px;
}
.coins--small { min-height: 0; font-size: var(--fs-m); padding: 0 var(--sp-3); box-shadow: none; }

.savebanner {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3);
  background: var(--lemon); color: var(--ink);
  border-bottom: var(--line) solid var(--ink);
  padding: var(--sp-3) var(--sp-4);
  font-weight: 700;
}
.savebanner[hidden] { display: none; }
.savebanner p { margin: 0; flex: 1 1 16rem; }

.toast {
  position: fixed;
  left: var(--sp-4); right: var(--sp-4); bottom: var(--sp-4);
  max-width: 560px; margin: 0 auto;
  background: var(--ink); color: var(--paper);
  border-radius: var(--r-card);
  padding: var(--sp-4);
  font-weight: 700;
  z-index: 10;
}

/* Fokus: Ring bleibt trotz harter Schatten sichtbar */
.btn:focus-visible, .tile:focus-visible { box-shadow: var(--shadow), 0 0 0 6px var(--lemon); }
.btn--ghost:focus-visible { box-shadow: 0 0 0 6px var(--lemon); }

/* 4 Bruchbauteil ---------------------------------------------------------- */
.frac {
  --fz: 2.5rem;
  display: inline-flex; align-items: center; gap: 0.2em;
  font-family: var(--font-display); font-weight: 900;
  font-size: var(--fz); line-height: 1;
  vertical-align: middle;
}
.frac--l { --fz: 3rem; }
.frac--xl { --fz: 4rem; }
.frac__stack { display: inline-flex; flex-direction: column; align-items: center; min-width: 1.1em; }
.frac__n, .frac__d { padding: 0.08em 0.15em; }
.frac__bar { align-self: stretch; height: 0.14em; min-height: 4px; background: var(--ink); border-radius: 999px; }

/* 5 Bildschirme ----------------------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  max-width: 720px; margin: 0 auto;
  padding: var(--sp-3) var(--sp-4);
  background: var(--bg);
}
.topbar__name { padding: 0 var(--sp-3); font-size: var(--fs-l); font-weight: 900; }
.topbar__stats { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; justify-content: flex-end; }
.streak { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-s); }

.main { max-width: 720px; margin: 0 auto; padding: var(--sp-5) var(--sp-4) var(--sp-7); }
.screen { display: flex; flex-direction: column; gap: var(--sp-5); }
.title { font-size: var(--fs-2xl); }
.lead { max-width: 52ch; font-size: var(--fs-l); }
.section-title { font-size: var(--fs-xl); margin-bottom: var(--sp-3); }

/* Profil */
.screen--profile .title { font-size: var(--fs-3xl); }
.profile-list { display: flex; flex-direction: column; gap: var(--sp-4); }
.profile-row { display: flex; flex-direction: column; gap: var(--sp-3); }
.profile-row__info { display: flex; align-items: center; gap: var(--sp-3); }
.profile-row__name { font-family: var(--font-display); font-weight: 900; font-size: var(--fs-xl); flex: 1; overflow-wrap: anywhere; }
.profile-row__actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-3); }
.profile-row__actions > .btn--primary { flex: 1 1 100%; }
.profile-row__actions > .btn--ghost { flex: 1 1 0; }
.profile-row__ask { flex-basis: 100%; font-weight: 700; }
.create .btn, .import .btn { width: 100%; }

/* Hub */
.hub__monster { display: flex; flex-direction: column; gap: var(--sp-4); }
.stage {
  background: var(--w-strahl);
  background-image: radial-gradient(circle at 50% 110%, rgba(255,255,255,.55) 0 38%, transparent 39%);
  border: var(--line) solid var(--ink);
  border-radius: var(--r-page);
  box-shadow: var(--shadow);
  display: grid; place-items: center;
  padding: var(--sp-4);
}
.monster-preview { width: min(240px, 70%); height: auto; }
.bubble {
  position: relative;
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: var(--r-card);
  box-shadow: var(--shadow);
  padding: var(--sp-4) var(--sp-5);
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-2);
}
.bubble::before {
  content: '';
  position: absolute; top: -13px; left: 44px;
  width: 22px; height: 22px;
  background: var(--paper);
  border-top: var(--line) solid var(--ink);
  border-left: var(--line) solid var(--ink);
  transform: rotate(45deg);
}
.bubble__text { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-l); line-height: 1.2; }
.bubble__reason { font-size: var(--fs-s); margin-bottom: var(--sp-2); }

.hub__worlds { display: flex; flex-direction: column; gap: var(--sp-4); align-items: stretch; }
.tiles { display: grid; grid-template-columns: 1fr; gap: var(--sp-4); }
.tile {
  display: flex; width: 100%; align-items: stretch; text-align: left;
  padding: 0; overflow: hidden;
  min-height: 96px;
  background: var(--paper); color: var(--ink);
  border: var(--line) solid var(--ink);
  border-radius: var(--r-card);
  box-shadow: var(--shadow);
  font: inherit; cursor: pointer;
  transition: transform 80ms ease-out, box-shadow 80ms ease-out;
  -webkit-tap-highlight-color: transparent;
}
.tile:active { transform: translate(2px, 2px); box-shadow: var(--shadow-pressed); }
.tile__art {
  flex: none; width: 96px;
  display: grid; place-items: center;
  background: var(--tile);
  border-right: var(--line) solid var(--ink);
}
.tile__motif { width: 76px; height: auto; }
.tile__body { display: flex; flex-direction: column; gap: var(--sp-1); padding: var(--sp-3) var(--sp-4); }
.tile__name { font-family: var(--font-display); font-weight: 900; font-size: var(--fs-l); line-height: 1.1; }
.tile__blurb { font-size: var(--fs-s); line-height: 1.35; }
.tile__stars { display: flex; flex-wrap: wrap; gap: 2px; margin-top: auto; padding-top: var(--sp-1); }
.star { width: 22px; height: 22px; fill: var(--paper); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.star--on { fill: var(--lemon); }

@media (min-width: 900px) {
  .main:has(.screen--hub) { max-width: 1100px; }
  .topbar { max-width: 1100px; }
  .screen--hub { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: var(--sp-6); align-items: start; }
}

/* Welt und Aufgabe */
.frac--s { --fz: 1.3em; vertical-align: middle; margin: 0 0.1em; }
.rich { overflow-wrap: anywhere; }
.prompt, .sheet__text, .bubble__text--hint { line-height: 1.7; }
.screen--world { gap: var(--sp-4); }
.world__head { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-2); }
.world__head .btn--ghost { padding: 0 var(--sp-2); min-height: 44px; }
.world__title { font-size: var(--fs-xl); padding: var(--sp-2) var(--sp-4); background: var(--world); border: var(--line) solid var(--ink); border-radius: var(--r-card); box-shadow: var(--shadow); align-self: stretch; }
.world__body { display: flex; flex-direction: column; gap: var(--sp-5); }
.world__sub { font-weight: 700; }

.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); }
.level {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 64px; padding: var(--sp-2);
  background: var(--paper); color: var(--ink);
  border: var(--line) solid var(--ink); border-radius: var(--r-card); box-shadow: var(--shadow);
  font-family: var(--font-display); cursor: pointer;
}
.level__n { font-weight: 900; font-size: var(--fs-l); }
.level__name { font-size: var(--fs-s); font-weight: 700; overflow-wrap: anywhere; text-align: center; }
.level[aria-pressed='true'] { background: var(--world); box-shadow: var(--shadow-pressed); transform: translate(2px, 2px); }
.level:focus-visible, .kind:focus-visible, .pick:focus-visible, .keycap:focus-visible { box-shadow: var(--shadow), 0 0 0 6px var(--lemon); }

.kinds { display: grid; gap: var(--sp-3); }
.kind {
  display: flex; width: 100%; align-items: center; justify-content: space-between; gap: var(--sp-3);
  min-height: 60px; padding: var(--sp-2) var(--sp-4); text-align: left;
  background: var(--paper); color: var(--ink);
  border: var(--line) solid var(--ink); border-left: 14px solid var(--world); border-radius: var(--r-card); box-shadow: var(--shadow);
  font-family: var(--font-display); font-weight: 900; font-size: var(--fs-l); line-height: 1.1; cursor: pointer;
}
.kind:active, .pick:active { transform: translate(2px, 2px); box-shadow: var(--shadow-pressed); }
.kind__stars { display: flex; gap: 2px; flex: none; }

.dots { display: flex; gap: var(--sp-2); }
.dot2 { width: 22px; height: 22px; border-radius: 50%; border: var(--line) solid var(--ink); background: var(--paper); }
.dot2--done { background: var(--world, var(--algae)); }
.dot2--now { background: var(--lemon); }

.taskview { display: flex; flex-direction: column; gap: var(--sp-4); }
.taskcard { display: flex; flex-direction: column; gap: var(--sp-4); }
.prompt { font-family: var(--font-text); font-weight: 700; font-size: var(--fs-l); line-height: 1.5; max-width: 60ch; }
.prompt:focus { outline: none; box-shadow: none; }
.nudge { min-height: 1.5em; font-weight: 700; color: var(--ink); }
.nudge:empty { display: none; }

.answer { display: flex; flex-direction: column; gap: var(--sp-3); }
.answer__row { display: flex; gap: var(--sp-3); align-items: flex-start; flex-wrap: wrap; }
.answer__row .field { flex: 1 1 160px; width: auto; min-width: 0; margin-bottom: 0; font-family: var(--font-display); font-weight: 700; font-size: var(--fs-xl); }
.answer__keys { display: flex; gap: var(--sp-2); }
.answer .field__label { margin-bottom: 0; }
.answer .field__hint { margin: 0; }
.keycap {
  min-width: 52px; min-height: 52px; padding: 0 var(--sp-3);
  background: var(--lemon); color: var(--ink);
  border: var(--line) solid var(--ink); border-radius: var(--r-field); box-shadow: var(--shadow);
  font-family: var(--font-display); font-weight: 900; font-size: var(--fs-xl); cursor: pointer;
}
.keycap:active { transform: translate(2px, 2px); box-shadow: var(--shadow-pressed); }
.keycap:disabled, .pick:disabled, .btn:disabled { opacity: 0.55; cursor: not-allowed; }

.pick {
  display: flex; align-items: center; gap: var(--sp-3); width: 100%; min-height: 56px; padding: var(--sp-2) var(--sp-4); text-align: left;
  background: var(--paper); color: var(--ink);
  border: var(--line) solid var(--ink); border-radius: var(--r-field); box-shadow: var(--shadow);
  font-family: var(--font-display); font-weight: 700; font-size: var(--fs-l); cursor: pointer;
}
.pick[aria-pressed='true'] { background: var(--lemon); box-shadow: var(--shadow-pressed); transform: translate(2px, 2px); }
.pick__no { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); font-size: var(--fs-s); }
.pick__text { overflow-wrap: anywhere; }
.pick--choice { font-size: var(--fs-xl); }

.taskview__coach { display: flex; align-items: flex-start; gap: var(--sp-3); }
.taskview__monster { flex: none; width: 76px; }
.taskview__monster .monster-preview { width: 100%; }
.taskview__bubble { flex: 1; min-width: 0; padding: var(--sp-3) var(--sp-4); margin-top: var(--sp-2); }
.taskview__bubble::before { top: 20px; left: -13px; transform: rotate(-45deg); }
.bubble__text--hint { font-family: var(--font-text); font-weight: 400; font-size: var(--fs-m); line-height: 1.5; }
.bubble__label { font-family: var(--font-display); font-weight: 900; font-size: var(--fs-s); }
.bubble__drawing { width: 100%; max-width: 420px; }

.bar {
  position: sticky; bottom: 0; z-index: 4;
  display: flex; gap: var(--sp-3); justify-content: space-between;
  padding: var(--sp-3) 0 var(--sp-4);
  background: linear-gradient(to bottom, transparent, var(--bg) 25%);
}
.bar .btn { flex: 1; min-height: 56px; }
.bar .btn--primary { flex: 1.4; }

.drawing { display: block; width: 100%; height: auto; max-width: 420px; }
.strip-part--anim { animation: strip-in 220ms ease-out both; }
@keyframes strip-in { from { opacity: 0; } to { opacity: 1; } }

.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  max-height: 85vh; overflow-y: auto;
  background: var(--paper);
  border-top: var(--line) solid var(--ink);
  border-radius: var(--r-page) var(--r-page) 0 0;
  box-shadow: 0 -4px 0 var(--ink);
  animation: sheet-up 220ms ease-out both;
}
.sheet--right { background: #D8F5E6; }
.sheet--wrong { background: #FFFFFF; border-top-color: var(--bramble); box-shadow: 0 -4px 0 var(--bramble); }
.sheet__inner { max-width: 720px; margin: 0 auto; padding: var(--sp-5) var(--sp-4) var(--sp-5); display: flex; flex-direction: column; gap: var(--sp-3); }
.sheet__title { font-family: var(--font-display); font-weight: 900; font-size: var(--fs-xl); line-height: 1.1; }
.sheet__text { font-size: var(--fs-m); max-width: 60ch; }
.sheet__extra { display: flex; flex-direction: column; gap: var(--sp-2); align-items: flex-start; }
.sheet__card { background: var(--lemon); border: var(--line) solid var(--ink); border-radius: var(--r-field); padding: var(--sp-2) var(--sp-3); }
.sheet__drawing { max-width: 420px; }
.sheet__actions { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-2); }
.sheet__actions .btn { flex: 1 1 auto; }
.sheet__actions .btn--ghost { flex: 0 1 auto; }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }

.coin-fly { position: fixed; z-index: 30; width: 20px; height: 20px; pointer-events: none; }
.note-card { display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-3); }
.summary { display: flex; flex-direction: column; gap: var(--sp-3); align-items: flex-start; }
.summary__actions { display: flex; flex-wrap: wrap; gap: var(--sp-3); }

@media (min-width: 720px) {
  .world__head { flex-direction: row; align-items: center; }
  .world__title { align-self: auto; flex: 1; }
  .taskview__monster { width: 120px; }
  .world__title { font-size: var(--fs-2xl); }
}


/* Zahlenstrahl-Schieber, Streifen, Experimente ------------------------------ */
.answer--line .drawing, .answer--strips .drawing, .experiment__stage .drawing { max-width: 560px; }
.nl-live { cursor: pointer; user-select: none; -webkit-user-select: none; }
.nl-live .nl-track, .nl-live .nl-pin { touch-action: none; }
.nl-pin { cursor: grab; outline: none; }
.nl-pin .nl-ring { opacity: 0; }
.nl-pin:focus-visible .nl-ring { opacity: 1; }
.nl-pin--idle .nl-dot { fill-opacity: 0.55; stroke-dasharray: 5 3; }
.nl-live--locked { cursor: default; }
.nl-live--locked .nl-pin { cursor: default; }
.nl-ghost[hidden] { display: none; }

.strips-widget { display: flex; flex-direction: column; gap: var(--sp-3); }
.strips-widget .drawing { max-width: 560px; }
.strips-live { max-width: 440px; touch-action: none; user-select: none; -webkit-user-select: none; }
.strip-cell { cursor: pointer; outline: none; }
.strip-cell:hover { fill-opacity: 0.25; }
.strip-cell[aria-pressed='true']:hover { fill-opacity: 1; }
.strip-cell:focus-visible { stroke: var(--ink); stroke-width: 5; paint-order: stroke; filter: drop-shadow(0 0 0 var(--lemon)); outline: 4px solid var(--lemon); outline-offset: -4px; }
.strips-widget--locked .strip-cell { cursor: default; }
.strips-widget__controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); }
.strips-widget__controls .btn { flex: 1 1 130px; min-height: 48px; padding: 0 var(--sp-4); font-size: var(--fs-m); }
.strips-widget__status { flex: 1 1 140px; font-weight: 700; min-width: 0; }
.strips-widget__count { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.experiment { display: flex; flex-direction: column; gap: var(--sp-4); }
.experiment .card__title { margin-bottom: 0; }
.experiment__play { display: flex; flex-direction: column; gap: var(--sp-3); }
.experiment__stage { display: block; }
.experiment__narrow { max-width: 100%; margin-top: var(--sp-2); }
.experiment__caption { font-size: var(--fs-m); min-height: 3em; max-width: 60ch; }
.experiment__controls { display: flex; flex-wrap: wrap; gap: var(--sp-3); }
.experiment__controls .btn { flex: 1 1 140px; min-height: 52px; }
.experiment__pairs { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.pick--small { width: auto; min-height: 48px; font-size: var(--fs-m); padding: var(--sp-1) var(--sp-3); }
.experiment__question { display: flex; flex-direction: column; gap: var(--sp-3); border-top: 3px dashed var(--ink); padding-top: var(--sp-4); }
.experiment__options { display: flex; flex-direction: column; gap: var(--sp-3); }
.experiment__options .pick--choice { font-size: var(--fs-l); }
.pick--right, .pick--right[aria-pressed='true'] { background: #D8F5E6; border-color: var(--ink); opacity: 1; }
.pick--wrong, .pick--wrong[aria-pressed='true'] { background: #FFE3EC; }
.experiment__feedback { font-weight: 700; min-height: 1.5em; }
.experiment__actions { display: flex; justify-content: flex-start; }
.regel-karte {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-3);
  background: var(--lemon); color: var(--ink);
  border: var(--line) solid var(--ink); border-radius: var(--r-card); box-shadow: var(--shadow);
  padding: var(--sp-4) var(--sp-5);
}
.regel-karte__title { font-family: var(--font-display); font-weight: 900; font-size: var(--fs-xl); }
.regel-karte__text { font-size: var(--fs-l); max-width: 60ch; line-height: 1.5; }

.kinds__item { display: flex; flex-direction: column; gap: var(--sp-1); }
.linkbtn {
  align-self: flex-start; min-height: 44px; padding: 0 var(--sp-3); background: none; border: 0;
  color: var(--ink); font-family: var(--font-text); font-weight: 700; font-size: var(--fs-s);
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer; border-radius: var(--r-field);
}
.linkbtn:focus-visible { box-shadow: 0 0 0 4px var(--lemon), 0 0 0 6px var(--ink); }
.bubble__more { margin-top: var(--sp-2); }
.bubble__more .btn { min-height: 48px; }

/* 6 Bewegung -------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
  .btn:active, .tile:active { transform: none; }
}

.legal { margin-top: 1.5rem; text-align: center; opacity: 0.85; }
.legal p { margin: 0.25rem 0; }
.legal a { color: inherit; text-decoration: underline; display: inline-block; min-height: 44px; line-height: 44px; padding: 0 0.4rem; }

/* Sichern und Mitbringen: Code, Ziehen und Ablegen, Erinnerung */
.profile-row__backup { flex: 0 0 auto; opacity: 0.8; }
.profile-row__code:empty, .backup__mount:empty { display: none; }
.profile-row__actions > .btn--ghost { flex: 1 1 8rem; }
.dropzone {
  border: var(--line) dashed var(--ink);
  border-radius: var(--r-card);
  padding: var(--sp-4);
  margin: var(--sp-2) 0 var(--sp-4);
  text-align: center;
  background: rgba(255, 255, 255, 0.6);

.dropzone--over { background: var(--lemon); border-style: solid; }
.dropzone__hint { margin: 0 0 var(--sp-3); }
@media (pointer: coarse) { .dropzone__hint { display: none; } }

  line-height: 1.4;
  overflow-wrap: anywhere;
  resize: vertical;
}
.codebox { display: flex; flex-direction: column; gap: var(--sp-2); margin-top: var(--sp-3); }
.codebox p { margin: 0; }
.import .field__label { display: block; margin-bottom: var(--sp-2); }
.import textarea { margin-bottom: var(--sp-3); }
.backup-hint { margin-bottom: var(--sp-4); background: var(--lemon); }
.backup-hint p { margin: var(--sp-2) 0 var(--sp-3); }
.backup-hint__actions { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-3); }
.backup-hint__actions .btn { flex: 1 1 10rem; }

/* Impressum und Datenschutz */
.legal__links { display: flex; justify-content: center; gap: var(--sp-2); flex-wrap: wrap; }
.legal__links .btn--ghost { text-decoration: underline; min-height: 44px; padding: 0 var(--sp-2); }
.screen--recht .card + .legal__switch, .legal__switch { margin-top: var(--sp-4); }
.screen--recht .world__title { background: var(--surface, #fff); }
.legal-text h3 { font-size: var(--fs-md, 1.1rem); margin: var(--sp-4) 0 var(--sp-1); }
.legal-text p { max-width: 65ch; }
.legal-text a, .screen--recht a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

/* ==========================================================================
   Monster-Bereich: Tabs, Monster, Shop, Schrank, Hoehle, Sammelkarten
   ========================================================================== */
.main:has(.screen--monster) { max-width: 960px; }
@media (min-width: 900px) { .topbar { max-width: 960px; } }

.screen--monster { gap: var(--sp-4); }
.monster__head { display: flex; align-items: center; gap: var(--sp-2); }
.monster__head .btn--ghost { padding: 0 var(--sp-2); min-height: 44px; }
.monster__head .title { font-size: var(--fs-xl); }

/* Zeichnungen */
.monster-svg, .overlay__monster { display: block; width: 100%; height: auto; overflow: visible; }
.thumb { display: block; width: 100%; height: 100%; overflow: hidden; }

/* Tabs */
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--sp-2); }
.tab {
  min-height: 48px; padding: 0 2px;
  background: var(--paper); color: var(--ink);
  border: var(--line) solid var(--ink); border-radius: 14px; box-shadow: 3px 3px 0 var(--ink);
  font-family: var(--font-display); font-weight: 700; font-size: 0.8125rem; line-height: 1.1; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tab[aria-selected='true'] { background: var(--lemon); box-shadow: 1px 1px 0 var(--ink); transform: translate(2px, 2px); font-weight: 900; }
.tab:focus-visible { box-shadow: 3px 3px 0 var(--ink), 0 0 0 6px var(--lemon); }
.tab[aria-selected='true']:focus-visible { box-shadow: 1px 1px 0 var(--ink), 0 0 0 6px var(--lemon); }
@media (min-width: 520px) { .tab { font-size: var(--fs-m); } }

.tabpanel:focus { outline: none; }
.panel { display: flex; flex-direction: column; gap: var(--sp-4); }
.panel__title { font-size: var(--fs-xl); }

/* Buehne und Sprechblase */
.stage--big { padding: var(--sp-5) var(--sp-4) var(--sp-3); }
.stage--big .monster-svg { width: min(280px, 78%); }
.stage--small { padding: var(--sp-3); }
.stage--small .monster-svg { width: min(170px, 62%); }
.coach { display: flex; align-items: center; gap: var(--sp-3); }
.coach__monster { flex: none; width: 92px; }
.coach__bubble { flex: 1; min-width: 0; padding: var(--sp-3) var(--sp-4); }
.coach__bubble::before { top: 50%; left: -13px; margin-top: -11px; transform: rotate(-45deg); }
.monstertab__bubble::before { left: 50%; margin-left: -11px; }

/* Monster-Tab */
.monstertab { display: flex; flex-direction: column; gap: var(--sp-5); }
.monstertab__hero { display: flex; flex-direction: column; gap: var(--sp-4); }
.growth { display: flex; flex-direction: column; gap: var(--sp-2); }
.growth__stage { font-size: var(--fs-2xl); }
.meter { height: 24px; background: var(--paper); border: var(--line) solid var(--ink); border-radius: var(--r-pill); overflow: hidden; }
.meter__fill { height: 100%; min-width: 6px; background: var(--algae); border-right: var(--line) solid var(--ink); border-radius: var(--r-pill); }
.growth__text { font-weight: 700; }
.streakline {
  display: flex; flex-direction: column; gap: 2px; align-items: flex-start;
  background: var(--lemon); border: var(--line) solid var(--ink); border-radius: var(--r-card); box-shadow: var(--shadow);
  padding: var(--sp-3) var(--sp-4);
}
.streakline__big { font-family: var(--font-display); font-weight: 900; font-size: var(--fs-xl); }
.feeds, .shopgrid, .wardrobe__list { display: flex; flex-direction: column; gap: var(--sp-3); }
.price { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 900; }
.price .coin-icon { width: 1.1em; height: 1.1em; }

/* Zeilenkarten: Futter, Shop, Schrank, Hoehle, Karten */
.feed, .shopcard, .wardrobe__item, .tcard {
  display: flex; align-items: stretch;
  background: var(--paper); border: var(--line) solid var(--ink); border-radius: var(--r-card); box-shadow: var(--shadow);
  overflow: hidden;
}
.feed__art, .shopcard__art, .wardrobe__art, .tcard__art {
  flex: none; width: 88px; display: grid; place-items: center; padding: var(--sp-2);
  background: #F6F0FF; border-right: var(--line) solid var(--ink);
}
.feed__body, .shopcard__body, .wardrobe__body, .tcard__body {
  flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: var(--sp-1); padding: var(--sp-3);
}
.feed { align-items: center; }
.feed__art { width: 64px; align-self: stretch; }
.feed__body { padding: var(--sp-2) var(--sp-3); }
.feed .btn { margin-right: var(--sp-3); min-width: 96px; min-height: 48px; padding: 0 var(--sp-3); flex: none; }
.feed__name, .shopcard__name, .wardrobe__name, .tcard__name { font-family: var(--font-display); font-weight: 900; font-size: var(--fs-m); line-height: 1.15; overflow-wrap: anywhere; }
.feed__meta, .shopcard__meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-3); font-size: var(--fs-s); }
.shopcard__body .btn, .wardrobe__body .btn { width: 100%; min-height: 48px; padding: 0 var(--sp-3); font-size: var(--fs-m); }
.shopcard__state { font-family: var(--font-display); font-weight: 900; min-height: 48px; display: flex; align-items: center; gap: var(--sp-2); }
.shopcard--owned, .wardrobe__item--on { background: #E4F8EE; }
.wardrobe__pos { font-family: var(--font-text); font-weight: 400; font-size: var(--fs-s); }
.wardrobe__actions { display: flex; gap: var(--sp-2); }
.wardrobe__actions .btn { flex: 1 1 auto; }
.wardrobe__actions .btn:nth-child(n+2) { flex: 0 0 48px; min-width: 48px; padding: 0; }
@media (min-width: 720px) {
  .shopgrid, .wardrobe__list { display: grid; grid-template-columns: 1fr 1fr; }
}
.cavetab .wardrobe__actions .btn:first-child { flex: 0 0 auto; width: auto; padding: 0 var(--sp-3); }
.cavetab__scene, .cavetab__list { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }

/* Shop-Kategorien */
.cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--sp-2); }
.cat {
  min-height: 48px; padding: 0 var(--sp-1);
  background: var(--paper); color: var(--ink);
  border: var(--line) solid var(--ink); border-radius: var(--r-pill); box-shadow: 3px 3px 0 var(--ink);
  font-family: var(--font-display); font-weight: 700; font-size: 0.875rem; cursor: pointer;
}
.cat[aria-pressed='true'] { background: var(--pumpkin); font-weight: 900; box-shadow: 1px 1px 0 var(--ink); transform: translate(2px, 2px); }
.cat:focus-visible { box-shadow: 3px 3px 0 var(--ink), 0 0 0 6px var(--lemon); }

/* Schrank: der Spiegel bleibt beim Scrollen sichtbar, damit man das Anziehen sieht */

.wardrobe__mirror {
  position: sticky; top: 68px; z-index: 3;
  display: flex; align-items: center; gap: var(--sp-3);
  background: var(--bg); margin: 0 -8px; padding: var(--sp-2) 8px;
}
.wardrobe__mirror .stage { flex: none; width: 112px; padding: var(--sp-1); }
.wardrobe__mirror .monster-svg { width: 100%; }
.wardrobe__line { margin: 0; font-size: var(--fs-s); }
.wardrobe__lists { display: flex; flex-direction: column; gap: var(--sp-5); }
.wardrobe__group { display: flex; flex-direction: column; gap: var(--sp-3); }
.wardrobe__slot { font-size: var(--fs-l); }
.wardrobe__empty { font-size: var(--fs-s); }
.swatches { display: flex; flex-wrap: wrap; gap: var(--sp-3); }
.swatch { gap: var(--sp-2); padding: 0 var(--sp-4) 0 var(--sp-2); min-height: 48px; font-size: var(--fs-m); }
.swatch__dot { width: 28px; height: 28px; border-radius: 50%; border: var(--line) solid var(--ink); flex: none; }
.swatch[aria-pressed='true'] { background: var(--lemon); box-shadow: var(--shadow-pressed); transform: translate(2px, 2px); }
@media (min-width: 760px) {
  .wardrobe { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--sp-5); align-items: start; }

  .wardrobe__mirror .stage { width: auto; padding: var(--sp-3); }
  .wardrobe__mirror .monster-svg { width: min(170px, 62%); }
  .wardrobe__line { font-size: var(--fs-m); font-weight: 700; }

/* Hoehle */

.cave__count { font-weight: 700; }
.cave__hint { margin: 0; }

.tcard--legendaer { background: #FFF6D1; }

.tcard__q { font-family: var(--font-display); font-weight: 900; font-size: 3rem; color: var(--lemon); line-height: 1; }
.tcard__rarity { font-size: var(--fs-s); }

.tcard--legendaer .tcard__badge { background: var(--lemon); }
.tcard__text { font-size: var(--fs-s); line-height: 1.4; }

/* Glueckwunsch-Meldung */

  position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: var(--sp-4);
  background: rgba(43, 27, 61, 0.7);
}
.overlay__card {
  position: relative; width: min(100%, 420px); max-height: 100%; overflow: auto;

}
.overlay__monster { width: min(220px, 70%); }
.overlay__title { font-size: var(--fs-xl); }
.overlay__stage { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-l); }
.spark {
  position: absolute; width: 20px; height: 20px; background: var(--lemon); border: 2.5px solid var(--ink);

  animation: spark 1400ms ease-in-out infinite; animation-delay: calc(var(--i) * 120ms);
}
@keyframes overlay-pop { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes spark { 0%, 100% { transform: scale(0.6) rotate(0); opacity: 0.6; } 50% { transform: scale(1.3) rotate(25deg); opacity: 1; } }

@media (min-width: 900px) {

}

  function experimentView(kind, { onDone }) {
    const exp = EXPERIMENTS[kind];
    if (!exp) return null;
    const title = h("h2", { class: "card__title", tabindex: "-1" }, exp.title);
    const question = h("div", { class: "experiment__question", hidden: true });
    const root2 = h("section", { class: "experiment card" });
    const feedback = h("p", { class: "experiment__feedback", role: "status" });
    let answered = false;
    const options = exp.question.options.map((o, i) => h("button", {
      type: "button",
      class: "pick pick--choice",
      "aria-pressed": "false",
      onclick: () => choose(i)
    }, h("span", { class: "pick__text" }, richText(o))));
    function choose(i) {
      if (answered) return;
      answered = true;
      const ok = i === exp.question.correct;
      options.forEach((b, j) => {
        b.disabled = true;
        b.setAttribute("aria-pressed", String(j === i));
        if (j === exp.question.correct) b.classList.add("pick--right");
        else if (j === i) b.classList.add("pick--wrong");
      });
      feedback.textContent = ok ? RIGHT[i % RIGHT.length] : WRONG[i % WRONG.length];
      const go2 = button("Weiter zu den Aufgaben", { variant: "primary", onClick: () => onDone({ skipped: false }) });
      const card = h(
        "div",
        { class: "regel-karte", role: "region", "aria-label": "Regel-Karte" },
        h("p", { class: "regel-karte__title" }, "Die Regel"),
        h("p", { class: "regel-karte__text" }, richText(exp.rule)),
        go2
      );
      root2.append(card);
      announce(`${feedback.textContent} Die Regel: ${exp.rule}`);
      go2.focus?.({ preventScroll: false });
    }
    const onReady = () => {
      if (!question.hidden) return;
      question.hidden = false;
      announce("Jetzt kommt eine Frage.");
    };
    question.append(
      h("p", { class: "prompt" }, richText(exp.question.prompt)),
      h("div", { class: "experiment__options", role: "group", "aria-label": "Antworten" }, options),
      feedback
    );
    root2.append(
      title,
      h("p", { class: "lead" }, richText(exp.intro, { size: "s" })),
      exp.build(onReady),
      question,
      h(
        "div",
        { class: "experiment__actions" },
        button("Kenn ich schon", { variant: "ghost", onClick: () => onDone({ skipped: true }) })
      )
    );
    return root2;
  }

  var ROUND = 5;

  function stars2(n) {
    return h(
      "span",
      { class: "kind__stars" },
      Array.from({ length: 3 }, (_, i) => h(
        "svg",
        { class: i < n ? "star star--on" : "star", viewBox: "0 0 24 24", "aria-hidden": "true", focusable: "false" },
        h("polygon", { points: "12,2.5 14.9,8.6 21.5,9.4 16.6,14 17.9,20.6 12,17.3 6.1,20.6 7.4,14 2.5,9.4 9.1,8.6" })
      )),
      h("span", { class: "sr-only" }, `${n} von 3 Sternen`)
    );
  }
  function renderWorld(root2, params, app3) {
    const w = worldByKey(params.world) ?? worldByKey("strahl");
    let level = levelMemory[w.key] ?? 1;
    let runner = null;
    let view = null;
    let session = null;
    let kind = null;
    let mode = "list";
    const body = h("div", { class: "world__body" });
    const title = h("h1", { class: "title world__title" }, w.name);
    const back = button("Zurück", { variant: "ghost", onClick: () => mode === "list" ? go("hub") : showList() });
    const backLabel = back.querySelector("span");
    root2.append(h(
      "div",
      { class: "screen screen--world", style: `--world:${w.color}` },
      h("header", { class: "world__head" }, back, title),
      body
    ));
    function showList() {
      view?.destroy();
      runner = null;
      view = null;
      mode = "list";
      backLabel.textContent = "Zur Karte";
      const p = app3.profile;
      const levelBtns = LEVELS.map((l) => h("button", {
        type: "button",
        class: "level",
        "aria-pressed": String(l.n === level),
        onclick: () => {
          level = l.n;
          levelMemory[w.key] = l.n;
          levelBtns.forEach((b, i) => b.setAttribute("aria-pressed", String(LEVELS[i].n === level)));
        }
      }, h("span", { class: "level__n" }, `Stufe ${l.n}`), h("span", { class: "level__name" }, l.name)));
      body.replaceChildren(
        h("p", { class: "lead" }, w.blurb),
        h(
          "section",
          { "aria-labelledby": "lvl-h" },
          h("h2", { class: "section-title", id: "lvl-h" }, "Wie schwer?"),
          h("div", { class: "levels", role: "group", "aria-labelledby": "lvl-h" }, levelBtns)
        ),
        h(
          "section",
          { "aria-labelledby": "kind-h" },
          h("h2", { class: "section-title", id: "kind-h" }, "Was üben wir?"),
          h("ul", { class: "kinds" }, KINDS[w.key].map((k) => h(
            "li",
            { class: "kinds__item" },
            h(
              "button",
              { type: "button", class: "kind", onclick: () => open(k) },
              h("span", { class: "kind__name" }, KIND_LABELS[k] ?? k),
              stars2(kindStars(p.mastery[k]))
            ),
            EXPERIMENTS[k] ? h("button", { type: "button", class: "linkbtn", "aria-label": `Experiment nochmal: ${KIND_LABELS[k] ?? k}`, onclick: () => showExperiment(k) }, "Experiment nochmal") : null
          )))
        )
      );
    }
    function open(k) {
      if (EXPERIMENTS[k] && !(app3.profile.seen ?? []).includes(k)) showExperiment(k);
      else start2(k);
    }
    function showExperiment(k) {
      view?.destroy();
      runner = null;
      view = null;
      mode = "experiment";
      kind = k;
      backLabel.textContent = "Zur Liste";
      const el = experimentView(k, {
        onDone: () => {
          const seen = app3.profile.seen ?? [];
          if (!seen.includes(k)) app3.setProfile({ ...app3.profile, seen: [...seen, k] });
          start2(k);
        }
      });
      body.replaceChildren(h("p", { class: "world__sub" }, `${KIND_LABELS[k] ?? k} · Ausprobieren`), el);
      el.querySelector("h2")?.focus();
    }
    function start2(k) {
      mode = "tasks";
      kind = k;
      levelMemory[w.key] = level;
      session = { size: ROUND, done: 0, coins: 0, right: 0 };
      runner = createRunner({
        profile: app3.profile,
        kind: k,
        level,
        rng: app3.rng,
        today: app3.today(),
        pickTask,
        onUpdate: (p, ev) => {
          app3.setProfile(p);
          if (ev?.card) app3.toast(`Neue Sammelkarte: ${ev.card.name}`);
        }
      });
      backLabel.textContent = "Andere Aufgabe";
      mountTask();
    }
    function mountTask() {
      view = createTaskView({ app: app3, runner, session, onNext: next, onSkip: skip });
      body.replaceChildren(
        h("p", { class: "world__sub" }, `${KIND_LABELS[kind] ?? kind} · Stufe ${level}, ${LEVELS[level - 1].name}`),
        view.el
      );
    }
    function skip() {
      runner.next();
      view.show();
    }
    function next() {
      session.done++;
      if (session.done % session.size === 0) {
        summary();
        return;
      }
      runner.next();
      view.show();
    }
    function summary() {
      view.destroy();
      const lines = session.right === session.size ? "Alle richtig. Das Monster wird größenwahnsinnig." : session.right >= 3 ? "Ordentlich! Das Monster ist satt, aber nicht ganz." : "Das Monster mag dich trotzdem. Übung macht Fresser.";
      body.replaceChildren(h(
        "div",
        { class: "card summary" },
        h("h2", { class: "card__title", tabindex: "-1", id: "sum-h" }, "Runde geschafft!"),
        h("p", { class: "lead" }, `${session.right} von ${session.size} richtig, ${session.coins} ${session.coins === 1 ? "Münze" : "Münzen"} gesammelt.`),
        h("p", null, lines),
        h(
          "div",
          { class: "summary__actions" },
          button("Weiter", { variant: "primary", onClick: () => {
            session.coins = 0;
            session.right = 0;
            runner.next();
            mountTask();
          } }),
          button("Zurück zur Karte", { onClick: () => go("hub") })
        )
      ));
      body.querySelector("#sum-h")?.focus();
    }
    if (params.kind && KINDS[w.key].includes(params.kind)) open(params.kind);
    else showList();
    return () => view?.destroy();
  }

      ),
      tablist,
      panel,
      ...backupButtons(app3)
    ));
    ctx.rerender();
    return () => {
      clearTimeout(timer);
      ctx.overlay?.remove();
    };
  }

  // src/ui/screens/recht.js
  function renderRecht(root2, params = {}) {
    const back = params.back === "hub" ? "hub" : "profile";
    const part = params.part === "datenschutz" ? "datenschutz" : "impressum";
    const zurueck = button("Zurück", { variant: "ghost", onClick: () => go(back) });
    const impressum = h(
      "section",
      { class: "card", "aria-label": "Impressum" },
      h("p", null, "Tobias Schmidbauer", h("br"), "Lilienstraße 32", h("br"), "93173 Wenzenbach"),
      h("p", null, "Kontakt: info@schmidbauer.jetzt"),
      h("p", null, "Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV: Tobias Schmidbauer, Anschrift wie oben."),
      h("p", { class: "small" }, "Dies ist ein rein privates Angebot ohne Bezug zu einem Dienstherrn oder einer Schule. Weitere Angaben: ", extLink(URLS.homepage, "schmidbauer.io"), ".")
    );
    const datenschutz = h(
      "section",
      { class: "card legal-text", "aria-label": "Datenschutz" },
      h("h3", null, "Verantwortlicher"),
      h("p", null, "Tobias Schmidbauer, Lilienstraße 32, 93173 Wenzenbach, info@schmidbauer.jetzt."),
      h("h3", null, "Die App selbst"),
      h("p", null, "Bruchmonster läuft komplett in deinem Browser. Die App hat keine Anmeldung, keine Cookies, keine Statistik und sendet keine Daten an einen Server. Name, Münzen und Lernfortschritt werden nur im Speicher deines Browsers abgelegt. Sicherungsdatei und Spielstand-Code liegen nur bei dir. Bitte gib keinen echten Nachnamen ein, ein Spitzname reicht."),
      h("h3", null, "Aufruf über GitHub Pages"),
      h(
        "p",
        null,
        "Diese Seite liegt auf GitHub und wird über GitHub Pages ausgeliefert. Beim Aufruf verarbeitet GitHub technisch notwendige Verbindungsdaten, zum Beispiel deine IP-Adresse, Datum und Uhrzeit sowie Angaben zu Browser und aufgerufener Seite. Darauf habe ich keinen Einfluss und keinen Zugriff. Es gilt die allgemeine Datenschutzerklärung von GitHub: ",
        extLink(URLS.github, "Allgemeine Datenschutzerklärung für GitHub"),
        "."
      ),
      h("p", null, "Wer das vermeiden möchte, lädt die Datei „bruchmonster.html“ herunter und öffnet sie im Browser. Sie läuft auch ohne Internet."),
      h("h3", null, "Verweise"),
      h("p", null, "Links zu GitHub, zur Lizenz und zu schmidbauer.io werden nur geladen, wenn du sie anklickst. Danach gelten die Datenschutzbestimmungen der jeweiligen Seite."),
      h("h3", null, "Deine Rechte"),
      h("p", null, "Du hast die Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung und Widerspruch nach der DSGVO. Da ich selbst keine Daten über dich speichere, kann ich dazu in der Regel nur auf GitHub verweisen. Beschwerden kannst du an die Datenschutzaufsicht richten, in Bayern an das Bayerische Landesamt für Datenschutzaufsicht (BayLDA)."),
      h("p", { class: "small" }, "Für Kinder: Frag bei Fragen zu diesen Texten deine Eltern oder deine Lehrkraft.")
    );
    root2.append(
      h(
        "div",
        { class: "screen screen--recht" },
        h("header", { class: "world__head" }, zurueck, h("h1", { class: "world__title" }, part === "impressum" ? "Impressum" : "Datenschutz")),
        part === "impressum" ? impressum : datenschutz,
        h(
          "p",
          { class: "legal__switch" },
          button(part === "impressum" ? "Zum Datenschutz" : "Zum Impressum", {
            variant: "secondary",
            onClick: () => go("recht", { back, part: part === "impressum" ? "datenschutz" : "impressum" })
          })
        )
      )
    );
  }

  // src/main.js
  var LAST_KEY = "bruchmonster:last";
  var store = createStore();
  var pad = (n) => String(n).padStart(2, "0");
  function readLast() {
    try {
      return localStorage.getItem(LAST_KEY);
    } catch {
      return null;
    }
  }
  function writeLast(id) {
    try {
      if (id) localStorage.setItem(LAST_KEY, id);
      else localStorage.removeItem(LAST_KEY);
    } catch {
    }
  }
  var coinsEl = h("span", { class: "coins", "data-coins": "0" }, h("span", { class: "coin-icon", "aria-hidden": "true" }), h("span", { class: "coins__n" }, "0"), h("span", { class: "sr-only" }, " Münzen"));
  var streakEl = h("span", { class: "streak" });
  var nameBtn = button("", { variant: "ghost", onClick: () => go("profile") });
  nameBtn.classList.add("topbar__name");
  var header = h(
    "header",
    { class: "topbar", hidden: true },
    nameBtn,
    h("div", { class: "topbar__stats" }, streakEl, coinsEl)
  );
  var toastEl = h("div", { class: "toast", role: "status", hidden: true });
  var toastTimer = null;
  var unsaved = createUnsaved();
  var saveBanner = h(
    "div",
    { class: "savebanner", role: "alert", hidden: true },
    h("p", null, "Speichern klappt gerade nicht – sichere deinen Spielstand als Datei."),
    button("Als Datei sichern", { variant: "primary", onClick: () => {
      const p = unsaved.get();
      if (p) downloadProfile(p);
    } })
  );
  var app2 = {
    store,
    unsaved,
    profile: null,
    rng: makeRng(Date.now()),
    today() {
      const d = /* @__PURE__ */ new Date();
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    },
    setProfile(p) {
      app2.profile = p;
      app2.updateHeader();
      const res = store.save(p);
      app2.noteSave(p, res);
      return res;
    },
    // Merkt Speicherfehler; das Banner bleibt, bis das Speichern wieder klappt.
    noteSave(p, res) {
      unsaved.note(p, res);
      saveBanner.hidden = unsaved.get() === null;
    },
    // Merkt, dass dieses Profil gerade gesichert wird (Datum und Stand), und speichert es. Gibt das Profil zurueck.
    recordBackup(p) {
      const marked = markBackedUp(p, app2.today());
      if (app2.profile?.id === marked.id) app2.setProfile(marked);
      else app2.noteSave(marked, store.save(marked));
      return marked;
    },
    // Sichern des aktiven Profils aus dem Arbeitsspeicher (immer der aktuelle Stand): als Datei oder als Code.
    exportProfile() {
      if (app2.profile) saveAsFile(app2, app2.profile);
    },
    copyCode(mount) {
      return app2.profile ? copyCode(app2, app2.profile, mount) : Promise.resolve(false);
    },
    openProfile(p) {
      app2.profile = p;
      writeLast(p.id);
      app2.updateHeader();
      go("hub");
    },
    forget(id) {
      if (app2.profile?.id === id) {
        app2.profile = null;
        app2.updateHeader();
      }
      if (readLast() === id) writeLast(null);
    },
    updateHeader() {
      const p = app2.profile;
      header.hidden = !p;
      if (!p) return;
      nameBtn.querySelector("span").textContent = p.name;
      nameBtn.setAttribute("aria-label", `${p.name}, Profil wechseln`);
      coinsEl.setAttribute("data-coins", String(p.coins));
      coinsEl.querySelector(".coins__n").textContent = String(p.coins);
      const days = p.streak.days;
      streakEl.textContent = days > 0 ? `${days} ${days === 1 ? "Tag" : "Tage"} in Folge` : "";
      streakEl.hidden = days === 0;
    },
    toast(text) {
      toastEl.textContent = text;
      toastEl.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.hidden = true;
      }, 6e3);
    }
  };
  var main = h("main", { id: "screen", class: "main" });
  document.getElementById("app").append(header, saveBanner, main, toastEl);
  startRouter(main, app2);
  registerScreen("profile", (root2, params, a) => {
    a.profile = null;
    a.updateHeader();
    return renderProfile(root2, params, a);
  });
  registerScreen("hub", renderHub);
  registerScreen("world", renderWorld);
  registerScreen("monster", renderMonster);
  registerScreen("recht", renderRecht);
  var profiles = store.listProfiles();
  var last = readLast();
  var start = profiles.length === 1 && profiles[0].id === last ? store.load(last) : null;
  if (start) app2.openProfile(start);
  else go("profile");
})();

</script>
